# TEMPORARY precision probe (breakfast experiment). DELETE after measuring.
# Pings /health every 5 min so we can compare scheduled vs actual fire times
# in the Actions UI and quantify GitHub's schedule jitter with our own data.
# Writes nothing (health only) — history stays pristine.
name: precision-probe

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # manual Run button, for the first immediate sample

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warmup ping
        run: curl -fsS --max-time 30 https://ine-assignment.ardev.in/health
